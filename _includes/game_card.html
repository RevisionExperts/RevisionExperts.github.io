<div class="game-card" style="display: flex; align-items: flex-start; gap: 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; margin-bottom: 20px; box-sizing: border-box;">
  
  <!-- Left Side: Image Panel -->
  <div class="game-card-image" style="flex-shrink: 0;">
    <img src="{{ include.image }}" alt="{{ include.name }}" style="width: 150px; height: 100px; object-fit: cover; border-radius: 6px; display: block; background-color: #222;">
  </div>
  
  <!-- Right Side: Content Stack (Name on Top, Description underneath) -->
  <div class="game-card-content" style="display: flex; flex-direction: column; justify-content: flex-start; height: 100%;">
    <h3 style="margin: 0 0 6px 0; font-size: 1.25rem;">
      <a href="{{ include.location | relative_url }}" style="color: #fff; text-decoration: none; font-family: sans-serif; font-weight: bold;">{{ include.name }}</a>
    </h3>
    <p style="margin: 0; color: #ccc; font-size: 0.95rem; line-height: 1.4; font-family: sans-serif;">
      {{ include.description }}
    </p>
  </div>

</div>
