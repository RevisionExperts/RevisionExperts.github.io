<!-- _includes/game_card.html -->
<a href="{{ include.location | relative_url }}" class="arcade-card-tab" style="background-color: {{ include.bg_color | default: '#ffffff' }} !important;">
  <div class="card-image-box" style="background-image: url('{{ include.image | relative_url }}');"></div>
  <div class="card-text-box">
    <h2>{{ include.name }}</h2>
    <p>{{ include.description }}</p>
  </div>
</a>
