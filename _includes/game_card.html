<div class="game-item-card" style="background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; width: 100%; box-sizing: border-box; text-align: left;">
  <a href="{{ include.location | relative_url }}" style="text-decoration: none; color: inherit; display: block; width: 100%;">
    <img src="{{ include.image_url }}" alt="{{ include.name }}" style="width: 100%; height: 160px; object-fit: cover; border-radius: 6px; display: block; margin-bottom: 12px; background-color: #222;">
    <h3 style="margin: 0 0 6px 0; font-size: 1.2rem; font-weight: bold; color: #ffffff; font-family: sans-serif;">{{ include.name }}</h3>
  </a>
  <p style="margin: 0; font-size: 0.95rem; color: #cccccc; line-height: 1.4; font-family: sans-serif;">{{ include.description }}</p>
</div>
