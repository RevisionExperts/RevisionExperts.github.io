<a href="{{ include.location | relative_url }}" class="game-card-anchor" style="text-decoration: none; color: inherit; display: block; margin-bottom: 20px;">
  <div class="game-card" style="display: flex; align-items: flex-start; gap: 16px; background: {{ include.bg_color | default: '#1a1a1a' }}; border: 1px solid #333; border-radius: 8px; padding: 16px; box-sizing: border-box; cursor: pointer; transition: transform 0.2s ease, border-color 0.2s ease;">
    
    <!-- Left Column: Image Area -->
    <div class="game-card-image" style="flex-shrink: 0;">
      <img src="{% if include.image %}{{ include.image }}{% else %}{{ include.image_url }}{% endif %}" alt="{{ include.name }}" style="width: 150px; height: 100px; object-fit: cover; border-radius: 6px; display: block; background-color: rgba(0,0,0,0.2);">
    </div>
    
    <!-- Right Column Text Stack: Name on top, description on bottom -->
    <div class="game-card-content" style="display: flex; flex-direction: column; justify-content: flex-start;">
      <h3 style="margin: 0 0 6px 0; font-size: 1.25rem; color: #fff; font-family: sans-serif; font-weight: bold;">
        {{ include.name }}
      </h3>
      <p style="margin: 0; color: #fff; font-size: 0.95rem; line-height: 1.4; font-family: sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">
        {{ include.description }}
      </p>
    </div>

  </div>
</a>
