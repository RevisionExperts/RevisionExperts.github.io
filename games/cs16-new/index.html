<!DOCTYPE html>
<html>
<head>
    <title>Counter-Strike 1.6</title>
    <style>
        canvas {
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            position: fixed;
            background: #000;
        }

        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }
    </style>
    <!-- Core game engine wrapper module -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    
    <!-- FIXED: Added the local LZMA engine link to handle Ultra compression -->
    <script src="./lzma-d.js"></script>
</head>
<body>

<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

<script>
    // Configures JSZip to pass LZMA-compressed assets to the newly loaded engine wrapper
    if (window.JSZip && window.LZMA) {
        window.JSZip.compressions["LZMA"] = {
            magic: "\x0e\x00",
            uncompressWorker: function() {
                return new window.JSZip.Worker(function(chunk) {
                    const decompressed = window.LZMA.decompress(chunk.data);
                    this.push({ data: decompressed, meta: chunk.meta });
                });
            }
        };
    }

    async function main() {
        const files = {};
        
        // Ensure this matches your exact file name in the folder (e.g., valve-lightweight.zip or valve.zip)
        const zipUrl = './valve-lightweight.zip';
        
        console.log("Streaming local LZMA 109MB archive straight into browser system memory...");
        
        try {
            const res = await fetch(zipUrl);
            if (!res.ok) throw new Error("valve asset was not found in this folder directory.");
            
            // The browser will now open the LZMA stream flawlessly without crashing
            const zip = await window.JSZip.loadAsync(await res.arrayBuffer());    

            await Promise.all(Object.keys(zip.files).map(async p => {
                const file = zip.files[p];
                if (file.dir) return;

                const path = `/rodir/${p}`;
                files[path] = await file.async("uint8array");
            }));

            console.log("Unpacking complete. Launching Xash3D engine wrapper...");

            Xash3D({
                arguments: ['-windowed', '-game', 'cstrike', '+_vgui_menus', '0'],
                canvas: document.getElementById('canvas'),
                ctx: document.getElementById('canvas').getContext('webgl2', {
                    alpha: false, depth: true, stencil: true, antialias: true
                }),
                dynamicLibraries: [
                    "filesystem_stdio.wasm",
                    "libref_gles3compat.wasm",
                    "cl_dlls/menu_emscripten_wasm32.wasm",
                    "dlls/cs_emscripten_wasm32.so",
                    "cl_dlls/client_emscripten_wasm32.wasm",
                    "/rwdir/filesystem_stdio.so",
                ],
                onRuntimeInitialized: function () {
                    Object.keys(files).forEach(k => {
                        const dir = k.split('/').slice(0, -1).join('/');
                        this.FS.mkdirTree(dir);
                        this.FS.writeFile(k, files[k]);
                    });
                    this.FS.chdir('/rodir');
                },
                locateFile: (p) => {
                    switch (p) {
                        case 'xash.wasm': return 'https://unpkg.com';
                        case '/rwdir/filesystem_stdio.so':
                        case 'filesystem_stdio.wasm': return 'https://unpkg.com';
                        case 'libref_gles3compat.wasm': return 'https://unpkg.com';
                        case 'cl_dlls/menu_emscripten_wasm32.wasm': return 'https://unpkg.com';
                        case 'dlls/cs_emscripten_wasm32.so': return 'https://unpkg.com';
                        case 'cl_dlls/client_emscripten_wasm32.wasm': return 'https://unpkg.com';
                        default: return p;
                    }
                },
            });
        } catch (err) {
            console.error("Fatal game boot error:", err.message);
        }
    }

    main();
</script>
</body>
</html>
