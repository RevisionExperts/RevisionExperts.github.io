<!DOCTYPE html>
<html>
<head>
    <title>Counter-Strike 1.6</title>
    <style>
        canvas {
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            position: fixed;
            background: #000;
        }

        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #4CAF50;
            font-family: sans-serif;
            font-size: 24px;
            font-weight: bold;
            z-index: 99;
            pointer-events: none;
        }
    </style>
    <!-- Core game engine wrapper -->
    <script src="https://unpkg.com"></script>
    
    <!-- LOCKED LOCAL ROUTE: Pulls the library directly from your repo to bypass CDN blocks -->
    <script src="./jszip.min.js"></script>
</head>
<body>

<div id="loading">Loading Files to RAM... Please Wait</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

<script>
    async function main() {
        const files = {};
        const statusText = document.getElementById('loading');
        
        // Target your exact 98MB compressed asset bundle file name
        const zipUrl = './valve-lightweight.zip';
        
        console.log("Streaming local 98MB archive straight into browser system memory...");
        
        try {
            statusText.innerText = "Downloading assets into browser RAM...";
            const res = await fetch(zipUrl);
            if (!res.ok) throw new Error("valve-lightweight.zip was not found in this folder directory.");
            
            statusText.innerText = "Unpacking archive directly inside memory...";
            
            // Reads the constructor properties straight out of your local script file token
            const zip = await window.JSZip.loadAsync(await res.arrayBuffer());    

            await Promise.all(Object.keys(zip.files).map(async p => {
                const file = zip.files[p];
                if (file.dir) return;

                const path = `/rodir/${p}`;
                files[path] = await file.async("uint8array");
            }));

            statusText.innerText = "Launching Xash3D Engine Canvas Loop...";
            statusText.style.display = 'none';

            Xash3D({
                arguments: ['-windowed', '-game', 'cstrike', '+_vgui_menus', '0'],
                canvas: document.getElementById('canvas'),
                ctx: document.getElementById('canvas').getContext('webgl2', {
                    alpha: false,
                    depth: true,
                    stencil: true,
                    antialias: true
                }),
                dynamicLibraries: [
                    "filesystem_stdio.wasm",
                    "libref_gles3compat.wasm",
                    "cl_dlls/menu_emscripten_wasm32.wasm",
                    "dlls/cs_emscripten_wasm32.so",
                    "cl_dlls/client_emscripten_wasm32.wasm",
                    "/rwdir/filesystem_stdio.so",
                ],
                onRuntimeInitialized: function () {
                    Object.keys(files).forEach(k => {
                        const dir = k.split('/').slice(0, -1).join('/');
                        this.FS.mkdirTree(dir);
                        this.FS.writeFile(k, files[k]);
                    });
                    this.FS.chdir('/rodir');
                },
                locateFile: (p) => {
                    switch (p) {
                        case 'xash.wasm':
                            return 'https://unpkg.com';
                        case '/rwdir/filesystem_stdio.so':
                        case 'filesystem_stdio.wasm':
                            return 'https://unpkg.com';
                        case 'libref_gles3compat.wasm':
                            return 'https://unpkg.com';
                        case 'cl_dlls/menu_emscripten_wasm32.wasm':
                            return 'https://unpkg.com';
                        case 'dlls/cs_emscripten_wasm32.so':
                            return 'https://unpkg.com';
                        case 'cl_dlls/client_emscripten_wasm32.wasm':
                            return 'https://unpkg.com';
                        default:
                            return p;
                    }
                },
            });
        } catch (err) {
            statusText.style.color = "#ff3333";
            statusText.innerText = "Fatal Memory Load Failure: " + err.message;
            console.error(err);
        }
    }

    main();
</script>
</body>
</html>
