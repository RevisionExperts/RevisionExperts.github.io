<!DOCTYPE html>
<html>
<head>
    <title>Counter-Strike 1.6</title>
    <style>
        canvas {
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            position: fixed;
            background: #000;
        }
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }
    </style>
    <!-- Core game engine components loaded 100% locally from your repo folder -->
    <script src="./raw.js"></script>
    <script src="./jszip.min.js"></script>
</head>
<body>

<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

<script>
    async function main() {
        const files = {};
        const zipUrl = './valve-lightweight.zip'; // Targets your unblocked, local 94.8MB file
        
        console.log("Streaming local archive straight into browser system memory...");
        
        try {
            const res = await fetch(zipUrl);
            if (!res.ok) throw new Error("valve.zip asset was not found in this folder directory.");
            
            // Standard archives open natively without script extensions
            const zip = await window.JSZip.loadAsync(await res.arrayBuffer());    

            await Promise.all(Object.keys(zip.files).map(async p => {
                const file = zip.files[p];
                if (file.dir) return;

                const path = `/rodir/${p}`;
                files[path] = await file.async("uint8array");
            }));

            console.log("Unpacking complete. Launching local Xash3D engine runtime wrapper...");

            Xash3D({
                arguments: ['-windowed', '-game', 'cstrike', '+_vgui_menus', '0'],
                canvas: document.getElementById('canvas'),
                ctx: document.getElementById('canvas').getContext('webgl2', {
                    alpha: false, depth: true, stencil: true, antialias: true
                }),
                dynamicLibraries: [
                    "filesystem_stdio.wasm",
                    "libref_webgl2.wasm", 
                    "cl_dlls/menu_emscripten_wasm32.wasm",
                    "dlls/cs_emscripten_wasm32.so",
                    "cl_dlls/client_emscripten_wasm32.wasm",
                    "/rwdir/filesystem_stdio.so",
                ],
                onRuntimeInitialized: function () {
                    Object.keys(files).forEach(k => {
                        const dir = k.split('/').slice(0, -1).join('/');
                        this.FS.mkdirTree(dir);
                        this.FS.writeFile(k, files[k]);
                    });
                    this.FS.chdir('/rodir');
                },
                locateFile: (p) => {
                    return './' + p;
                },
            });
        } catch (err) {
            console.error("Fatal game boot error:", err.message);
        }
    }

    main();
</script>
</body>
</html>
