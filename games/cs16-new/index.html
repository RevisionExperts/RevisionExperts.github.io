<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
    <title>Counter-Strike 1.6</title>
    <style>
        canvas {
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            position: fixed;
            background: #000;
        }
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #4CAF50;
            font-family: sans-serif;
            font-size: 24px;
            font-weight: bold;
            z-index: 99;
            pointer-events: none;
        }
    </style>
    <!-- Core game engine components loaded 100% locally from your repo folder -->
    <script src="./raw.js"></script>
    <script src="./jszip.min.js"></script>
</head>
<body>

<div id="loading">Streaming Game Files to RAM... Please Wait</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

<script>
    async function main() {
        const files = {};
        const statusText = document.getElementById('loading');
        const zipUrl = './valve-lightweight.zip'; // Targets your unblocked, local 97MB Deflate file
        
        console.log("Streaming local archive straight into browser system memory...");
        
        try {
            statusText.innerText = "Downloading assets into browser RAM...";
            const res = await fetch(zipUrl);
            if (!res.ok) throw new Error("valve-lightweight.zip asset was not found in this folder directory.");
            
            statusText.innerText = "Unpacking archive directly inside memory...";
            const zip = await window.JSZip.loadAsync(await res.arrayBuffer());    

            await Promise.all(Object.keys(zip.files).map(async p => {
                const file = zip.files[p];
                if (file.dir) return;

                const path = `/rodir/${p}`;
                files[path] = await file.async("uint8array");
            }));

            statusText.innerText = "Launching local Xash3D engine runtime wrapper...";
            statusText.style.display = 'none';

            Xash3D({
                arguments: ['-windowed', '-game', 'cstrike', '+_vgui_menus', '0'],
                canvas: document.getElementById('canvas'),
                ctx: document.getElementById('canvas').getContext('webgl2', {
                    alpha: false, depth: true, stencil: true, antialias: true
                }),
                dynamicLibraries: [
                    "filesystem_stdio.wasm",
                    "libref_webgl2.wasm", 
                    "cl_dlls/menu_emscripten_wasm32.wasm",
                    "dlls/cs_emscripten_wasm32.so",
                    "cl_dlls/client_emscripten_wasm32.wasm",
                    "/rwdir/filesystem_stdio.so",
                ],
                onRuntimeInitialized: function () {
                    Object.keys(files).forEach(k => {
                        const dir = k.split('/').slice(0, -1).join('/');
                        this.FS.mkdirTree(dir);
                        this.FS.writeFile(k, files[k]);
                    });
                    this.FS.chdir('/rodir');
                },
                locateFile: (p) => {
                    return './' + p;
                },
            });
        } catch (err) {
            statusText.style.color = "#ff3333";
            statusText.innerText = "Fatal Memory Load Failure: " + err.message;
            console.error(err);
        }
    }

    main();
</script>
</body>
</html>
