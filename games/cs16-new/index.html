<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS 1.6 Web Client</title>
    <style>
        body { margin: 0; background: #16161a; color: #fffffe; font-family: system-ui, sans-serif; text-align: center; }
        #canvas { width: 800px; height: 600px; background: #000; margin: 20px auto; display: block; border: 3px solid #72757e; border-radius: 4px; }
        #progressContainer { width: 800px; background: #242629; margin: 20px auto; border-radius: 6px; overflow: hidden; display: block; border: 1px solid #72757e; }
        #progressBar { width: 0%; height: 30px; background: #2cb67d; text-align: center; line-height: 30px; font-weight: bold; color: #fffffe; transition: width 0.1s linear; }
    </style>
</head>
<body>

    <h2>Counter-Strike 1.6 WebXash Engine</h2>
    <div id="progressContainer">
        <div id="progressBar">0% (Waiting for allocation)</div>
    </div>
    
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        var Module = {
            arguments: ['-game', 'cstrike'],
            canvas: document.getElementById('canvas'),
            setStatus: function(text) { console.log("Engine status: " + text); },
            onRuntimeInitialized: function() {
                console.log("Xash3D WebAssembly environment core loaded successfully.");
            }
        };

        async function fetchGameFiles() {
            // REPLACE THIS URL WITH YOUR DIRECT HUGGING FACE DOWNLOAD URL LATER
            const fileUrl = 'https://huggingface.co';
            const progressBar = document.getElementById('progressBar');

            try {
                const response = await fetch(fileUrl, { mode: 'cors' });
                if (!response.ok) throw new Error("Server responded with error status code.");

                const reader = response.body.getReader();
                const contentLength = +response.headers.get('Content-Length');
                
                let receivedLength = 0;
                let chunks = []; 

                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    
                    chunks.push(value);
                    receivedLength += value.length;
                    
                    let percentage = ((receivedLength / contentLength) * 100).toFixed(1);
                    progressBar.style.width = percentage + '%';
                    progressBar.innerText = percentage + '% Buffered into RAM';
                }

                let allChunks = new Uint8Array(receivedLength);
                let position = 0;
                for(let chunk of chunks) {
                    allChunks.set(chunk, position);
                    position += chunk.length;
                }

                // Injects the downloaded data package directly into browser virtual RAM
                Module['FS'].createDataFile('/', 'valve.zip', allChunks, true, true, true);
                
                document.getElementById('progressContainer').style.display = 'none';
                console.log("Assets loaded. Starting WebAssembly engine execution loop.");
                
                loadScript("xash.js");

            } catch (error) {
                progressBar.style.background = "#ef4565";
                progressBar.innerText = "RAM Allocation Failure: " + error.message;
            }
        }

        function loadScript(src) {
            let script = document.createElement('script');
            script.src = src;
            document.body.appendChild(script);
        }

        window.addEventListener('DOMContentLoaded', fetchGameFiles);
    </script>
</body>
</html>
