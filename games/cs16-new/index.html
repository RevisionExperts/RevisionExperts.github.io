<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Strike 1.6 Web Port</title>
    <style>
        /* Force the WebGL canvas to take up the full screen */
        canvas { 
            width: 100vw; 
            height: 100vh; 
            position: fixed; 
            top: 0; 
            left: 0; 
            background-color: #000;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000;
            user-select: none;
        }
    </style>

    <!-- FIX: Declare LZMA target namespace before loading the dependency scripts -->
    <script>
        window.LZMA = window.LZMA || {};
        window.LZMA_WORKER = window.LZMA_WORKER || {};
    </script>

    <!-- Load core Xash3D WebAssembly raw loader from jsDelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xash3d-fwgs@latest/dist/raw.js"></script>
</head>
<body>

    <!-- The engine targets this specific element to render the game screen -->
    <canvas id="canvas"></canvas>

    <script type="module">
        // Import additional required compression and client SDKs directly 
        import JSZip from 'https://jsdelivr.net';

        async function initGameEngine() {
            try {
                console.log("Initializing Xash3D-FWGS Engine...");

                // Initialize the package window structure 
                const ENV = {
                    canvas: document.getElementById('canvas'),
                    arguments: ['-dev', '3', '-log'],
                    
                    // Maps internal WASM system paths to the proper compiled client DLL paths
                    locateFile: (path) => {
                        if (path === 'cl_dlls/client_emscripten_wasm32.wasm') {
                            return 'https://cdn.jsdelivr.net/npm/cs16-client@latest/dist/cl_dll/client_emscripten_wasm32.wasm';
                        }
                        return path;
                    }
                };

                // Bind the initialized environment variables to the global loader context
                if (window.Xash3D) {
                    window.Xash3D(ENV);
                } else {
                    console.error("Xash3D raw engine script failed to bind globally.");
                }

            } catch (error) {
                console.error("Error setting up game engine runtime environment:", error);
            }
        }

        // Run setup immediately on window compilation
        window.addEventListener('DOMContentLoaded', initGameEngine);
    </script>
</body>
</html>
