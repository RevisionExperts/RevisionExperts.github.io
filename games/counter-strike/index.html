<!DOCTYPE html>

    <title>Counter-Strike 1.6 Web Port</title>

        /* Forces the game window to fill the entire screen */
        body { margin: 0; background-color: #000; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; display: block; position: fixed; top: 0; left: 0; }
    </style>
    
    <!-- The engine script link from the Reddit post -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- The rendering surface for the game graphics -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            arguments: ['-game', 'cstrike'], 
            preInit: [function() {
                // THE FINAL STEP FIX: 
                // This tells GitHub Pages to stream the 396MB zip file properly 
                // without corrupting it during the download process.
                FS.createPreloadedFile('/', 'valve.zip', 'valve.zip', false, true);
            }]
        };
    </script>

</body>
