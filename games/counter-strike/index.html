<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Strike 1.6 - RevisionExperts</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; display: flex; align-items: center; justify-content: center; }
        canvas { width: 100vw; height: 100vh; display: block; background-color: #000; }
        #loading-text { position: absolute; color: #ffa500; font-family: Arial, sans-serif; font-weight: bold; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="loading-text">Initializing Game Directories...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script type="text/javascript">
        if (!window.crossOriginIsolated && window.location.protocol !== 'file:') {
            if (window.name !== 'coi-loop') { window.name = 'coi-loop'; window.location.reload(); }
        }

        window.Module = {
            canvas: document.getElementById('canvas'),
            arguments: ['-game', 'cstrike', '-nostartup'],
            print: console.log,
            printErr: console.error,
            locateFile: function(path) { return path; },
            
            setStatus: function(text) {
                if (!text) {
                    var textElement = document.getElementById('loading-text');
                    if (textElement) textElement.style.display = 'none';
                    window.focus();
                    document.getElementById('canvas').focus();
                }
            },

            // AUTO-MAPPING INTERFACE: Scans and mounts common asset layouts on boot
            preRun: [function() {
                var fs = (typeof FS !== 'undefined') ? FS : (window.Module.FS || window.FS || null);
                if (fs) {
                    try {
                        // Rebuild core system asset trees inside WebAssembly RAM allocation layout
                        fs.createFolder('/', 'cstrike', true, true);
                        fs.createFolder('/', 'valve', true, true);
                        
                        // Force-inject key target engine map hooks natively from your loose directory folders
                        fs.createLazyFile('/cstrike', 'liblist.gam', 'cstrike/liblist.gam', true, false);
                        fs.createLazyFile('/valve', 'liblist.gam', 'valve/liblist.gam', true, false);
                        
                        // Tells the reader to load core game menu assets on demand from the repository paths
                        fs.createLazyFile('/cstrike', 'game.cfg', 'cstrike/game.cfg', true, false);
                        fs.createLazyFile('/valve', 'valve.rc', 'valve/valve.rc', true, false);
                        
                        console.log("Virtual file allocation tree successfully mapped.");
                    } catch (e) {
                        console.error("Directory collision override:", e);
                    }
                }
            }]
        };

        window.addEventListener('load', function() {
            const script = document.createElement('script');
            script.async = true;
            script.type = 'module';
            script.src = 'xash.js';
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
