<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Counter-Strike 1.6 Web Port</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; display: block; position: fixed; top: 0; left: 0; }
    </style>
    
    <!-- Loads JSZip archive reader tool -->
    <script src="https://skypack.dev"></script>
    
    <!-- FIXED URL: Loads the core raw engine script using official npm formatting -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- This canvas renders the game window -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            arguments: ['-game', 'cstrike'],
            
            // FIXED CDNs: Every single file path maps directly to its true npm location on jsDelivr
            locateFile: function(path) {
                switch(path) {
                    case 'xash.wasm':
                        return 'https://jsdelivr.net';
                    case '/rwdir/filesystem_stdio.so':
                    case 'filesystem_stdio.wasm':
                        return 'https://jsdelivr.net';
                    case 'libref_gles3compat.wasm':
                        return 'https://jsdelivr.net';
                    case 'cl_dlls/menu_emscripten_wasm32.wasm':
                        return 'https://jsdelivr.net';
                    case 'dlls/cs_emscripten_wasm32.so':
                        return 'https://jsdelivr.net';
                    case 'cl_dlls/client_emscripten_wasm32.wasm':
                        return 'https://jsdelivr.net';
                    default:
                        return path;
                }
            },

            preInit: [function() {
                // Safely stream the 396MB file directly from your GitHub repo
                FS.createPreloadedFile('/', 'valve.zip', 'valve.zip', false, true);
            }]
        };
    </script>

</body>
</html>
