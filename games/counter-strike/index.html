!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Strike 1.6 - RevisionExperts</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        canvas { width: 100vw; height: 100vh; display: block; background-color: #000; }
    </style>
</head>
<body>

    <!-- Direct rendering viewport canvas -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script type="text/javascript">
        // Direct browser injection loop for cross-origin multi-threading parameters
        if (!window.crossOriginIsolated && window.location.protocol !== 'file:') {
            if (window.name !== 'coi-loop') { window.name = 'coi-loop'; window.location.reload(); }
        }

        // WebAssembly Core Game Parameters pointing directly to your uploaded directories
        var Module = {
            canvas: document.getElementById('canvas'),
            arguments: ['-game', 'cstrike', '-nostartup'],
            print: console.log,
            printErr: console.error,
            locateFile: function(path) { return path; }
        };
    </script>
    
    <!-- Launches the game engine compiler script natively -->
    <script async type="module" src="xash.js"></script>

</body>
</html>
