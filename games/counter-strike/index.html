<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Strike 1.6 - RevisionExperts</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0c0d;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #loader-container {
            position: absolute;
            text-align: center;
            z-index: 10;
            width: 320px;
        }
        #status {
            margin-bottom: 15px;
            font-size: 14px;
            color: #ffa500;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .progress-track {
            width: 100%;
            height: 12px;
            background-color: #1a1c1e;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4500, #ff8c00);
            box-shadow: 0 0 10px #ff4500;
            transition: width 0.2s ease;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            display: none;
            background-color: #000;
        }
    </style>
</head>
<body>

    <div id="loader-container">
        <div id="status">Connecting to Local Repository... 0%</div>
        <div class="progress-track">
            <div id="progress-bar" class="progress-fill"></div>
        </div>
    </div>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script type="text/javascript">
        // Self-contained loop to force-enable cross-origin thread parameters
        if (!window.crossOriginIsolated && window.location.protocol !== 'file:') {
            if (window.name !== 'coi-loop') {
                window.name = 'coi-loop';
                window.location.reload();
            }
        }

        // WebAssembly Configuration Hooks
        var Module = {
            canvas: document.getElementById('canvas'),
            arguments: ['-game', 'cstrike', '-nostartup'],
            print: console.log,
            printErr: console.error,
            locateFile: function(path) { return path; },
            
            setStatus: function(text) {
                if (!text && gameFilesLoaded) {
                    document.getElementById('loader-container').style.display = 'none';
                    document.getElementById('canvas').style.display = 'block';
                }
            },
            
            // Delays engine start until our asynchronous download function returns true
            preRun: [function() {
                Module.addRunDependency('fp_load');
                downloadAndStitchGame();
            }]
        };

        var gameFilesLoaded = false;

        // THE ASYNCHRONOUS STITCHER: Downloads chunks concurrently without freezing the browser
        async function downloadAndStitchGame() {
            const parts = ['cstrike.zip.2', 'cstrike.zip.3', 'cstrike.zip.4', 'cstrike.zip.5'];
            const statusElement = document.getElementById('status');
            const progressBar = document.getElementById('progress-bar');
            
            // Track dynamic download tracking stats for each file chunk
            let loadedBytes = new Array(parts.length).fill(0);
            let totalBytes = new Array(parts.length).fill(0);
            let chunksData = [];

            try {
                // Initialize modern asynchronous fetch operations simultaneously
                const downloadPromises = parts.map((part, index) => {
                    return new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', part, true); // True makes it asynchronous!
                        xhr.responseType = 'arraybuffer';
                        
                        xhr.onprogress = function(e) {
                            if (e.lengthComputable) {
                                loadedBytes[index] = e.loaded;
                                totalBytes[index] = e.total;
                                
                                // Calculate total mathematical progress across all 4 streams
                                const totalLoaded = loadedBytes.reduce((a, b) => a + b, 0);
                                const totalSize = totalBytes.reduce((a, b) => a + b, 293000000); // Fallback to ~293MB
                                const pct = Math.min(Math.round((totalLoaded / totalSize) * 100), 99);
                                
                                statusElement.innerHTML = "Streaming Assets... " + pct + "%";
                                progressBar.style.width = pct + "%";
                            }
                        };
                        
                        xhr.onload = function() {
                            if (xhr.status === 200) {
                                chunksData[index] = new Uint8Array(xhr.response);
                                resolve();
                            } else {
                                reject("Failed to load chunk: " + part);
                            }
                        };
                        
                        xhr.onerror = () => reject("Network connectivity error.");
                        xhr.send(null);
                    });
                });

                // Wait for all 4 asynchronous network operations to successfully finish
                await Promise.all(downloadPromises);
                
                statusElement.innerHTML = "Stitching asset blocks together...";
                progressBar.style.width = "99%";
                
                // Construct single continuous data array out of individual chunks
                const finalSize = chunksData.reduce((acc, chunk) => acc + chunk.length, 0);
                const combinedFile = new Uint8Array(finalSize);
                let offset = 0;
                for (let chunk of chunksData) {
                    combinedFile.set(chunk, offset);
                    offset += chunk.length;
                }
                
                // Mount file into the WebAssembly runtime space
                Module.FS_createDataFile('/', 'cstrike.zip', combinedFile, true, false);
                
                statusElement.innerHTML = "Launching Counter-Strike...";
                progressBar.style.width = "100%";
                gameFilesLoaded = true;
                
                // Tell the engine to turn on
                Module.removeRunDependency('fp_load');
                
            } catch (err) {
                statusElement.innerHTML = "CRITICAL LOAD ERROR";
                statusElement.style.color = "#ff0000";
                console.error(err);
            }
        }
    </script>
    
    <script async src="xash.js"></script>
</body>
</html>
