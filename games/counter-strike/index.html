<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Strike 1.6 - RevisionExperts</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0c0d;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #loader-container {
            position: absolute;
            text-align: center;
            z-index: 10;
            width: 320px;
        }
        #status {
            margin-bottom: 15px;
            font-size: 14px;
            color: #ffa500;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .progress-track {
            width: 100%;
            height: 12px;
            background-color: #1a1c1e;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #333;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff4500, #ff8c00);
            box-shadow: 0 0 10px #ff4500;
            transition: width 0.2s ease;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            display: none;
            background-color: #000;
        }
    </style>
</head>
<body>

    <div id="loader-container">
        <div id="status">Connecting to Repository... 0%</div>
        <div class="progress-track">
            <div id="progress-bar" class="progress-fill"></div>
        </div>
    </div>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script type="text/javascript">
        // Self-contained loop to force-enable cross-origin thread parameters
        if (!window.crossOriginIsolated && window.location.protocol !== 'file:') {
            if (window.name !== 'coi-loop') {
                window.name = 'coi-loop';
                window.location.reload();
            }
        }

        // WebAssembly Core Parameters
        var Module = {
            canvas: document.getElementById('canvas'),
            arguments: ['-game', 'cstrike', '-nostartup'],
            print: console.log,
            printErr: console.error,
            locateFile: function(path) { return path; },
            
            setStatus: function(text) {
                if (!text && gameFilesLoaded) {
                    document.getElementById('loader-container').style.display = 'none';
                    document.getElementById('canvas').style.display = 'block';
                }
            }
        };

        var gameFilesLoaded = false;

        // THE FIXED ASYNCHRONOUS STITCHER: Boots outside of preRun to prevent timing locks
        async function downloadAndStitchGame() {
            const parts = ['cstrike.zip.2', 'cstrike.zip.3', 'cstrike.zip.4', 'cstrike.zip.5'];
            const statusElement = document.getElementById('status');
            const progressBar = document.getElementById('progress-bar');
            
            let loadedBytes = new Array(parts.length).fill(0);
            let totalBytes = new Array(parts.length).fill(0);
            let chunksData = [];

            try {
                const downloadPromises = parts.map((part, index) => {
                    return new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', part, true); 
                        xhr.responseType = 'arraybuffer';
                        
                        xhr.onprogress = function(e) {
                            if (e.lengthComputable) {
                                loadedBytes[index] = e.loaded;
                                totalBytes[index] = e.total;
                                
                                const totalLoaded = loadedBytes.reduce((a, b) => a + b, 0);
                                const totalSize = totalBytes.reduce((a, b) => a + b, 293000000); 
                                const pct = Math.min(Math.round((totalLoaded / totalSize) * 100), 99);
                                
                                statusElement.innerHTML = "Streaming Game Chunks... " + pct + "%";
                                progressBar.style.width = pct + "%";
                            }
                        };
                        
                        xhr.onload = function() {
                            if (xhr.status === 200) {
                                chunksData[index] = new Uint8Array(xhr.response);
                                resolve();
                            } else {
                                reject("Failed to fetch chunk.");
                            }
                        };
                        
                        xhr.onerror = () => reject("Network error.");
                        xhr.send(null);
                    });
                });

                await Promise.all(downloadPromises);
                
                statusElement.innerHTML = "Stitching asset blocks together...";
                progressBar.style.width = "99%";
                
                // Wait for Module.FS to be defined by xash.js before creating the file
                const checkFS = setInterval(() => {
                    if (Module.FS && Module.FS.createDataFile) {
                        clearInterval(checkFS);
                        
                        const finalSize = chunksData.reduce((acc, chunk) => acc + chunk.length, 0);
                        const combinedFile = new Uint8Array(finalSize);
                        let offset = 0;
                        for (let chunk of chunksData) {
                            combinedFile.set(chunk, offset);
                            offset += chunk.length;
                        }
                        
                        // Create virtual file bundle inside WebAssembly memory space
                        Module.FS_createDataFile('/', 'cstrike.zip', combinedFile, true, false);
                        
                        statusElement.innerHTML = "Launching Counter-Strike...";
                        progressBar.style.width = "100%";
                        gameFilesLoaded = true;
                        
                        // If setStatus was waiting, hide the loader immediately
                        document.getElementById('loader-container').style.display = 'none';
                        document.getElementById('canvas').style.display = 'block';
                    }
                }, 100);
                
            } catch (err) {
                statusElement.innerHTML = "FILE TRANSFER ERROR";
                statusElement.style.color = "#ff0000";
                console.error(err);
            }
        }

        // Trigger the asynchronous download stream globally on window load
        window.addEventListener('load', function() {
            downloadAndStitchGame();
        });
    </script>
    
    <script async type="module" src="xash.js"></script>
</body>
</html>
