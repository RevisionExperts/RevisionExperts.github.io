<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter-Strike 1.6 - RevisionExperts</title>
    <style>
        body { margin: 0; background-color: #0b0c0d; color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #loader-container { position: absolute; text-align: center; z-index: 10; width: 340px; }
        #status { margin-bottom: 5px; font-size: 14px; color: #ffa500; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        #data-counter { margin-bottom: 15px; font-size: 12px; color: #888; font-family: monospace; }
        .progress-track { width: 100%; height: 12px; background-color: #1a1c1e; border-radius: 6px; overflow: hidden; border: 1px solid #333; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff4500, #ff8c00); box-shadow: 0 0 10px #ff4500; transition: width 0.1s linear; }
        canvas { width: 100vw; height: 100vh; display: none; background-color: #000; }
    </style>
</head>
<body>

    <div id="loader-container">
        <div id="status">Streaming Engine Pipeline...</div>
        <div id="data-counter">Initializing Asset Matrix...</div>
        <div class="progress-track"><div id="progress-bar" class="progress-fill"></div></div>
    </div>

    <canvas id="canvas" onclick="window.focus(); this.focus();" oncontextmenu="event.preventDefault()"></canvas>

    <script type="text/javascript">
        if (!window.crossOriginIsolated && window.location.protocol !== 'file:') {
            if (window.name !== 'coi-loop') { window.name = 'coi-loop'; window.location.reload(); }
        }

        // Universal bytes formatter for clean KB/MB readout calculation display
        function formatBytes(bytes) {
            if (bytes === 0) return '0 KB';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        window.Module = {
            canvas: document.getElementById('canvas'),
            arguments: ['-game', 'cstrike', '-nostartup'],
            print: console.log,
            printErr: console.error,
            locateFile: function(path) { return path; },
            
            setStatus: function(text) {
                var statusElement = document.getElementById('status');
                var progressBar = document.getElementById('progress-bar');
                var counterElement = document.getElementById('data-counter');
                
                if (text) {
                    statusElement.innerHTML = text;
                    
                    // Natively capture WebAssembly compile steps to drive the percentage slider tracker bar
                    var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                    if (match) {
                        var curr = parseFloat(match[2]);
                        var total = parseFloat(match[4]);
                        var pct = Math.round((curr / total) * 100);
                        progressBar.style.width = pct + "%";
                        counterElement.innerHTML = formatBytes(curr) + " / " + formatBytes(total);
                    }
                } else {
                    document.getElementById('loader-container').style.display = 'none';
                    document.getElementById('canvas').style.display = 'block';
                    window.focus();
                    document.getElementById('canvas').focus();
                }
            },

            preRun: [function() {
                var fs = (typeof FS !== 'undefined') ? FS : (window.Module.FS || window.FS || null);
                if (fs) {
                    try {
                        fs.createFolder('/', 'cstrike', true, true);
                        fs.createFolder('/', 'valve', true, true);
                        
                        // Link virtual directories straight to your loose repository folders
                        fs.createLazyFile('/cstrike', 'liblist.gam', 'cstrike/liblist.gam', true, false);
                        fs.createLazyFile('/valve', 'liblist.gam', 'valve/liblist.gam', true, false);
                        fs.createLazyFile('/cstrike', 'game.cfg', 'cstrike/game.cfg', true, false);
                        fs.createLazyFile('/valve', 'valve.rc', 'valve/valve.rc', true, false);
                    } catch (e) { console.error(e); }
                }
            }]
        };

        // DIRECT UN-THROTTLED LAUNCH TRIGGER SEQUENCE
        window.addEventListener('load', function() {
            document.getElementById('status').innerHTML = "Compiling Engine Modules...";
            document.getElementById('progress-bar').style.width = "25%";
            document.getElementById('data-counter').innerHTML = "Reading local script bundles...";

            const script = document.createElement('script');
            script.async = true;
            script.type = 'module';
            script.src = 'xash.js'; // Boots directly via native tag mapping format
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
